name: CentOS 8 system malloc diagnostic

on:
  push:
    branches: [centos8-compat, upgrade/upstream-r22-glibc228-20261024]
    paths:
      - .github/workflows/centos8-system-malloc.yml
      - test/glibc-compat/build-workerd.sh
      - test/glibc-compat/check-allocator.py
      - test/glibc-compat/centos-smoke.py
      - test/glibc-compat/Dockerfile
      - packages/runtime/workerd.lock.json
      - third_party/workerd
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: centos8-system-malloc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workerd:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Initialize the exact pinned workerd source
        run: git submodule update --init --depth 1 third_party/workerd
      - name: Inspect available build storage
        run: |
          df -h "$GITHUB_WORKSPACE"
          docker system df -v
      - uses: actions/cache/restore@v4
        with:
          path: |
            .temp/glibc-compat/action-cache
            .temp/glibc-compat/repository-cache
          key: centos8-bazel-9.2-${{ hashFiles('test/glibc-compat/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            centos8-bazel-9.2-${{ hashFiles('test/glibc-compat/Dockerfile') }}-
      - uses: docker/setup-buildx-action@v3
      - name: Build LLVM and static C++ runtimes on glibc 2.28
        uses: docker/build-push-action@v6
        with:
          context: test/glibc-compat
          file: test/glibc-compat/Dockerfile
          load: true
          tags: workerd-glibc228
          cache-from: type=gha,scope=centos8-llvm22
          cache-to: type=gha,mode=max,scope=centos8-llvm22
      - name: Build the single-variable system malloc diagnostic and exercise a Worker
        id: compile
        run: |
          set -euo pipefail
          mkdir -p .temp/glibc-compat .temp/glibc-compat-system-malloc/evidence
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.temp/glibc-compat,target=/var/tmp/open-compute-glibc228" \
            --workdir /workspace \
            workerd-glibc228 bash test/glibc-compat/build-workerd.sh system
      - name: Exercise the binary in unmodified CentOS 8.2 userspace
        run: python3 -B test/glibc-compat/centos-smoke.py --allocator system
      - name: Prepare reusable caches after success or failure
        id: cache_files
        if: always()
        run: |
          set -euo pipefail
          for cache_dir in .temp/glibc-compat/action-cache .temp/glibc-compat/repository-cache; do
            if [ -d "$cache_dir" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$cache_dir"
              du -sh "$cache_dir"
              echo 'present=true' >> "$GITHUB_OUTPUT"
            fi
          done
      - uses: actions/cache/save@v4
        if: always() && steps.cache_files.outputs.present == 'true'
        with:
          path: |
            .temp/glibc-compat/action-cache
            .temp/glibc-compat/repository-cache
          key: centos8-bazel-9.2-${{ hashFiles('test/glibc-compat/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record remaining build storage
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          docker system df -v
          sudo du -sh .temp/glibc-compat || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workerd-linux-x64-glibc228-system-malloc-diagnostic
          path: .temp/glibc-compat-system-malloc/evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
