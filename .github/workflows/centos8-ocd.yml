name: CentOS 8 ocd compatibility
on:
  push:
    branches: [centos8-compat, upgrade/upstream-r22-glibc228-20261024]
    paths:
      - 'crates/**'
      - 'packages/runtime/**'
      - 'docs/references/single-binary.md'
      - 'test/glibc-compat/build-ocd.sh'
      - 'test/glibc-compat/check-runtime-tests.sh'
      - 'test/glibc-compat/verify-workerd.py'
      - 'test/glibc-compat/test_verify_workerd.py'
      - 'test/glibc-compat/ocd-smoke.py'
      - '.github/workflows/centos8-ocd.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: centos8-ocd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixture-images:
    uses: ./.github/workflows/container-images.yml
    with:
      arm64: false
  package:
    needs: fixture-images
    # The non-root browser fixture uses the runner's unchanged native sandbox.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Initialize pinned source submodules
        run: git submodule update --init --depth 1 third_party/workerd third_party/gitserver
      - uses: ./.github/actions/prepare-container-fixture-images
      - name: Select the artifact from the tracked compatibility pin
        id: workerd
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          pin = json.load(open('packages/runtime/workerd-glibc228.lock.json'))
          inputs = pin['source']['buildInputs']
          match = re.fullmatch(r'https://github.com/charlzyx/open-compute/actions/runs/([0-9]+)', inputs['compatibilityWorkflowRun'])
          assert match is not None
          artifact = inputs['compatibilityArtifactId']
          assert re.fullmatch(r'[0-9]+', artifact)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run-id={match[1]}\nartifact-id={artifact}\n')
          PYTHON
      - name: Download the exact qualified workerd artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: charlzyx/open-compute
          run-id: ${{ steps.workerd.outputs.run-id }}
          artifact-ids: ${{ steps.workerd.outputs.artifact-id }}
          path: .temp/glibc-ocd/workerd
      - name: Verify fixture tooling, artifact provenance and content before use
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B -m unittest discover -s test/containers-fixture -p 'test_*.py'
          python3 -B -m unittest discover -s test/glibc-compat -p test_verify_workerd.py
          python3 -B test/glibc-compat/verify-workerd.py
      - uses: docker/setup-buildx-action@v3
      - name: Build the glibc 2.28 Rust packaging environment
        uses: docker/build-push-action@v6
        with:
          context: test/glibc-compat
          file: test/glibc-compat/Dockerfile.ocd
          tags: ocd-glibc228
          load: true
          cache-from: type=gha,scope=centos8-ocd
          cache-to: type=gha,mode=max,scope=centos8-ocd
      - uses: actions/cache/restore@v4
        id: cargo_cache
        with:
          path: .temp/glibc-ocd/target
          key: centos8-ocd-rust198-${{ hashFiles('Cargo.lock', 'test/glibc-compat/Dockerfile.ocd') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            centos8-ocd-rust198-${{ hashFiles('Cargo.lock', 'test/glibc-compat/Dockerfile.ocd') }}-
      - name: Build and verify the self-contained compatible ocd
        env:
          FIXTURE_INPUT: ${{ env.OPEN_COMPUTE_TEST_CONTAINERS_INPUT }}
        run: |
          set -euo pipefail
          mkdir -p .temp/glibc-ocd/evidence
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=$GITHUB_WORKSPACE" \
            --mount "type=bind,source=$RUNNER_TEMP,target=$RUNNER_TEMP" \
            --workdir "$GITHUB_WORKSPACE" \
            --env "OPEN_COMPUTE_TEST_CONTAINERS_INPUT=$FIXTURE_INPUT" \
            ocd-glibc228 bash test/glibc-compat/build-ocd.sh
      - name: Exercise the complete daemon and Worker in CentOS 8.2
        run: python3 -B test/glibc-compat/ocd-smoke.py
      - name: Return build outputs to the non-root test owner
        run: sudo chown -R "$(id -u):$(id -g)" .temp/glibc-ocd
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Prepare the pinned native browser fixture without sandbox overrides
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          lock="$PWD/test/browser-fixture.lock.json"
          platform=$(jq -er '.targets["linux-x64"].platform' "$lock")
          url=$(jq -er '.targets["linux-x64"].url' "$lock")
          sha256=$(jq -er '.targets["linux-x64"].sha256' "$lock")
          fixture=$(mktemp -d "$PWD/.temp/browser-fixture-XXXXXXXX")
          curl --fail --location --output "$fixture/archive.zip" "$url"
          printf '%s  %s\n' "$sha256" "$fixture/archive.zip" | sha256sum --check
          unzip -q "$fixture/archive.zip" -d "$fixture/source"
          bun scripts/prepare-browser.ts \
            --source "$fixture/source/chrome-headless-shell-$platform/chrome-headless-shell" \
            --dest "$fixture/prepared" >> "$GITHUB_ENV"
      - name: Run complete glibc-built library suites as the non-root host user
        run: bash test/glibc-compat/check-runtime-tests.sh run
      - name: Prepare owned Cargo cache and build evidence
        if: always()
        run: |
          if [ -d .temp/glibc-ocd ]; then
            sudo chown -R "$(id -u):$(id -g)" .temp/glibc-ocd
            du -sh .temp/glibc-ocd/target || true
          fi
          df -h "$GITHUB_WORKSPACE"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .temp/glibc-ocd/target
          key: ${{ steps.cargo_cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ocd-linux-x64-glibc228-experiment
          path: .temp/glibc-ocd/evidence/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
