name: Set up container fixture Engine tools
description: Install the pinned Colima CLI and its standard Intel macOS CI tools

runs:
  using: composite
  steps:
    - name: Install native Engine tools
      shell: bash
      run: |
        set -euo pipefail
        test "$RUNNER_OS:$RUNNER_ARCH" = macOS:X64
        brew install lima docker
        tools="$RUNNER_TEMP/open-compute-colima/bin"
        mkdir -p "$tools"
        curl --fail --location --output "$tools/colima" \
          https://github.com/abiosoft/colima/releases/download/v0.10.3/colima-Darwin-x86_64
        printf '%s  %s\n' \
          3082737fe8a98afda11cba7d9a20b6e56fe80c6153464beda04bec630758770b \
          "$tools/colima" | shasum -a 256 --check
        chmod 755 "$tools/colima"
        echo "$tools" >> "$GITHUB_PATH"
